<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">X1AOHJ</title>
  <desc id="d">Models / Vision / Agents / Tools — Steal the noise, ship the signal.</desc>
  <defs>
    <pattern id="dot" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <circle cx="4" cy="4" r="2.8" fill="#8a0a14" />
    </pattern>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" />
      <stop offset="1" stop-color="#fff" />
    </linearGradient>
    <mask id="fade"><rect x="700" width="500" height="300" fill="url(#fadeGrad)" /></mask>
    <clipPath id="field"><polygon points="800,0 1200,0 1200,300 700,300" /></clipPath>
    <style>
      text{font-family:'Arial Black','Arial Bold',Impact,'Helvetica Neue',sans-serif}
      .field,.slash{animation:charge .42s cubic-bezier(.2,.9,.1,1) backwards}
      .slash{animation-delay:.07s}
      @keyframes charge{from{transform:translateX(560px)}}
      .dots{animation:drift 2.4s linear infinite}
      @keyframes drift{to{transform:translate(-13.156px,-4.788px)}}
      .slam,.hop{transform-box:fill-box;transform-origin:center}
      .slam{animation:slam .34s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-16deg)}55%{opacity:1;transform:scale(.9) rotate(4deg)}100%{transform:none}}
      .hop{animation:hop 6s ease-out infinite}
      @keyframes hop{0%,90%,100%{transform:none}93%{transform:translateY(-8px) rotate(-4deg)}96%{transform:translateY(1px) rotate(1deg)}}
      .rule{transform-box:fill-box;transform-origin:0 50%;animation:grow .22s .78s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes grow{from{transform:scaleX(0)}}
      .tagline{animation:from-left .3s .84s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes from-left{from{opacity:0;transform:translateX(-40px)}}
      .s1,.s2{animation:from-right .3s .9s cubic-bezier(.2,.8,.2,1) backwards}
      .s2{animation-delay:1s}
      @keyframes from-right{from{opacity:0;transform:translateX(90px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#0b0b0b" />
  <g class="field">
    <polygon points="800,0 1200,0 1200,300 700,300" fill="#e60012" />
    <g clip-path="url(#field)" mask="url(#fade)" opacity="0.6">
      <rect class="dots" x="660" y="-40" width="600" height="380" fill="url(#dot)" />
    </g>
  </g>
  <polygon class="slash" points="772,0 786,0 686,300 672,300" fill="#f4f4f4" />
  
  <g transform="rotate(-4 120 126)">
    <g class="slam" style="animation-delay:300ms">
      <g class="hop" style="animation-delay:2400ms">
        <rect x="78" y="76" width="96" height="112" fill="#8a0a14" />
        <rect x="72" y="70" width="96" height="112" fill="#f4f4f4" />
        <text x="120" y="157.0" fill="#0b0b0b" font-family="'Arial Black',Impact,sans-serif" font-size="86" font-weight="900" text-anchor="middle">X</text>
      </g>
    </g>
  </g>
  <g transform="rotate(3 218 138)">
    <g class="slam" style="animation-delay:370ms">
      <g class="hop" style="animation-delay:2490ms">
        <rect x="186" y="94" width="76" height="100" fill="#8a0a14" />
        <rect x="180" y="88" width="76" height="100" fill="#e60012" />
        <text x="218" y="169.7" fill="#f4f4f4" font-family="Georgia,'Times New Roman',serif" font-size="88" font-weight="700" text-anchor="middle">1</text>
      </g>
    </g>
  </g>
  <g transform="rotate(-2 316 126)">
    <g class="slam" style="animation-delay:440ms">
      <g class="hop" style="animation-delay:2580ms">
        <rect x="274" y="72" width="96" height="120" fill="#8a0a14" />
        <rect x="268" y="66" width="96" height="120" fill="#0b0b0b" stroke="#f4f4f4" stroke-width="3" />
        <text x="316" y="162.0" fill="#f4f4f4" font-family="Impact,'Arial Black',sans-serif" font-size="100" font-weight="900" text-anchor="middle">A</text>
      </g>
    </g>
  </g>
  <g transform="rotate(5 423 137)">
    <g class="slam" style="animation-delay:510ms">
      <g class="hop" style="animation-delay:2670ms">
        <rect x="382" y="92" width="94" height="102" fill="#8a0a14" />
        <rect x="376" y="86" width="94" height="102" fill="#f4f4f4" />
        <text x="423" y="171.6" fill="#e60012" font-family="'Courier New',Courier,monospace" font-size="96" font-weight="700" text-anchor="middle">O</text>
      </g>
    </g>
  </g>
  <g transform="rotate(-3 528 128)">
    <g class="slam" style="animation-delay:580ms">
      <g class="hop" style="animation-delay:2760ms">
        <rect x="488" y="78" width="92" height="112" fill="#8a0a14" />
        <rect x="482" y="72" width="92" height="112" fill="#e60012" />
        <text x="528" y="157.5" fill="#0b0b0b" font-family="'Arial Black',Impact,sans-serif" font-size="82" font-weight="900" text-anchor="middle">H</text>
      </g>
    </g>
  </g>
  <g transform="rotate(2 626 138)">
    <g class="slam" style="animation-delay:650ms">
      <g class="hop" style="animation-delay:2850ms">
        <rect x="592" y="94" width="80" height="100" fill="#8a0a14" />
        <rect x="586" y="88" width="80" height="100" fill="#f4f4f4" />
        <text x="626" y="172.6" fill="#0b0b0b" font-family="'Times New Roman',Times,serif" font-size="96" font-weight="700" font-style="italic" text-anchor="middle">J</text>
      </g>
    </g>
  </g>
  <rect class="rule" x="72" y="220" width="48" height="6" fill="#e60012" />
  <text class="tagline" x="72" y="256" fill="#f4f4f4" font-size="22" font-weight="900" font-style="italic" letter-spacing="2">MODELS / VISION / AGENTS / TOOLS</text>
  <text class="s1" x="1150" y="206" fill="#0b0b0b" font-size="30" font-weight="900" font-style="italic" text-anchor="end">STEAL THE NOISE.</text>
  <text class="s2" x="1150" y="244" fill="#f4f4f4" font-size="30" font-weight="900" font-style="italic" text-anchor="end">SHIP THE SIGNAL.</text>
</svg>
